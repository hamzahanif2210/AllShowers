run_name: Electron-Allshower


data:
  path: /n/holylfs05/LABS/arguelles_delgado_lab/Everyone/hhanif/tambo_simulations_for_training/h5_files_v3/combined_electrons.h5 
  samples_energy_trafo:
    - [Log, {alpha: 0.0}]
    - [StandardScaler, {shape: [1, 1]}]
  samples_coordinate_trafo:
    - [StandardScaler, {shape: [1, 1, 2]}]
  cond_trafo:
    - [Log, {alpha: 0.0}]
    - [StandardScaler, {shape: [1, 1]}]
  samples_time_trafo:
    - [Log, {alpha: 1.e-6}]
    - [StandardScaler, {shape: [1, 1]}]
  return_noise: True
  return_direction: True
  val_len: 30000


model:
  identity_init: true        # Fix 1: zero-init output head
  num_layers: 24
  dim_inputs: [4, 6, 4]   
  dim_embedding: 64
  num_head: 4
  num_blocks: 4
  dim_feedforward: 256
  num_points_cond: 512
  activation: GELU
  num_layer_cond: 4
  num_particles: 2
  qk_norm: true
  v_norm: false
  value_residual: true
  attn_gating: true
  fused_mlp: true
  flow_config:
    frequencies: 3
    time_schedule: pow


train:
  num_epochs: 60
  batch_size: 256
  learning_rate: 3.e-5
  optimizer: lion
  scheduler: CosineWarmup
  scheduler_kwargs:
    gamma: 0.5
  weight_decay: 1.e-2
  grad_clip: 0.2
  ema_decay: 0.9999      # back to 0.9999, since it no longer affects val loss
  ema_start_step: 500    # keep this, lets model stabilise before EMA kicks in